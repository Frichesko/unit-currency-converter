<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Конвертер валют і одиниць</h1>
    </header>

    <main>
        <section>
            <h2>Вибір типу конвертації</h2>
            <div class="form-group">
                <label for="conversion_category">Оберіть категорію:</label>
                <select id="conversion_category" name="conversion_category">
                    <option value="currency">Валюта</option>
                    <option value="length">Довжина</option>
                    <option value="weight">Вага</option>
                </select>
            </div>
        </section>

        <section>
            <h2>Форма конвертації</h2>
            <form id="converter-form">
                <div class="form-group">
                    <label for="set_type">Оберіть вхідну одиницю</label>
                    <select id="set_type" name="set_type">
                        <option value="USD">USD</option>
                        <option value="UAH">UAH</option>
                        <option value="EUR">EUR</option>
                        <option value="MM">Міліметри</option>
                        <option value="SM">Сантиметри</option>
                        <option value="MT">Метри</option>
                        <option value="KM">Кілометри</option>
                        <option value="GR">Грами</option>
                        <option value="KG">Кілограми</option>
                        <option value="TN">Тони</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="set_convertation">Уведіть суму або значення</label>
                    <input type="number" id="set_convertation" name="set_convertation">
                </div>

                <div class="form-group">
                    <label for="get_type">Оберіть вихідну одиницю</label>
                    <select id="get_type" name="get_type">
                        <option value="USD">USD</option>
                        <option value="UAH">UAH</option>
                    </select>
                </div>

                <button type="submit" id="cnvrt_btn">Конвертувати</button>

                <div class="form-group">
                    <label for="get_convertation">Отримана сума або значення</label>
                    <output id="get_convertation" name="get_convertation"></output>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Курс є орієнтовним і може відрізнятися від банківського.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
