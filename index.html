<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Конвертер валют і одиниць</h1>
    </header>

    <main>
        <section>
            <h2>Вибір типу конвертації</h2>
            <div class="form-group">
                <label for="conversion_category">Оберіть категорію:</label>
                <select id="conversion_category" name="conversion_category">
                    <option value="currency">Валюта</option>
                    <option value="length">Довжина</option>
                    <option value="weight">Вага</option>
                </select>
            </div>
        </section>

        <section>
            <h2>Форма конвертації</h2>
            <form id="converter-form">
                <div class="converter-row">
                    <div class="field-col">
                        <div class="form-group">
                            <label for="set_type">Оберіть вхідну одиницю:</label>
                            <select id="set_type" name="set_type">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="UAH">UAH</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="set_convertation">Уведіть суму або значення (amount):</label>
                            <input 
                                type="number" 
                                id="set_convertation" 
                                name="amount" 
                                min="0.01" 
                                step="any" 
                                required 
                                placeholder="Введіть число > 0"
                            >
                        </div>
                    </div>

                    <div class="action-col">
                        <button type="submit" id="cnvrt_btn">Конвертувати</button>
                    </div>

                    <div class="field-col">
                        <div class="form-group">
                            <label for="get_type">Оберіть вихідну одиницю:</label>
                            <select id="get_type" name="get_type">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="UAH" selected>UAH</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="get_convertation">Отримана сума або значення:</label>
                            <output id="get_convertation" name="get_convertation" for="set_convertation set_type get_type">0</output>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <section id="history-section">
            <h2>Історія конвертацій</h2>
            <ul id="history-list">

            </ul>
            <p id="history-count">Кількість конвертацій в історії: 0</p>
        </section>

        <section>
            <h2>Актуальні курси (Frankfurter API)</h2>
            <p id="rates-loading" style="display: none; color: var(--primary); font-weight: 500;">Завантаження курсів валют...</p>
            <p id="rates-error" style="display: none; color: #ef4444; font-weight: 500;"></p>
            <ul id="rates-list">

            </ul>
            <p id="rates-count">Кількість валют: 0</p>
            <p id="rates-date" style="font-size: 13px; color: var(--text-muted);"></p>
            <button type="button" id="refresh-rates-btn">Оновити курси</button>
        </section>
    </main>

    <footer>
        <p>Курс є орієнтовним і може відрізнятися від банківського.</p>
    </footer>
</body>
</html>
